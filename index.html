<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4EF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="课程日历">
<title>课程日历 · 课程表与日历</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232E6B5A'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='3.4' stroke-linecap='round'%3E%3Cpath d='M16 24h32'/%3E%3Crect x='14' y='16' width='36' height='34' rx='6'/%3E%3Cpath d='M24 11v8M40 11v8'/%3E%3C/g%3E%3Cpath d='M40 34l-10 8-4-4.4' fill='none' stroke='%23fff' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20192%20192%22%3E%3Crect%20width%3D%22192%22%20height%3D%22192%22%20rx%3D%2246%22%20fill%3D%22%232E6B5A%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2210%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M48%2072h96%22%2F%3E%3Crect%20x%3D%2242%22%20y%3D%2248%22%20width%3D%22108%22%20height%3D%22102%22%20rx%3D%2218%22%2F%3E%3Cpath%20d%3D%22M72%2033v24M120%2033v24%22%2F%3E%3C%2Fg%3E%3Cpath%20d%3D%22M120%20102l-30%2024-12-13.2%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2210%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap">
<style>
/* ============ 基础（以日历 UI 为基准） ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F4EF; --card:#FFFFFF; --ink:#27241F; --muted:#8F897E; --faint:#CFC9BC;
  --line:#EAE7DE; --accent:#2E6B5A; --accent-soft:#E3EFEA; --on-accent:#FFFFFF;
  --amber:#B9822C; --amber-soft:#F6EEDA; --red:#B4553F; --red-soft:#F6E8E4;
  --blue:#4A6FA5; --blue-soft:#E6EDF6; --purple:#7B5E9B; --purple-soft:#EEE8F5;
  --shadow:0 10px 30px rgba(39,36,31,.08);
  --r-lg:24px; --r-md:14px; --topbar-h:46px;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ 顶栏与视图切换 ============ */
.topbar{
  position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);
}
.brand{display:flex;align-items:center;gap:8px}
.brand-icon{color:var(--accent);display:grid;place-items:center}
.brand-icon svg{width:22px;height:22px}
.brand-name{font-size:16px;font-weight:800;letter-spacing:.01em}
.viewseg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.viewseg button{padding:6px 15px;font-size:13px;font-weight:600;color:var(--muted);border-radius:999px;white-space:nowrap}
.viewseg button.active{background:var(--accent);color:var(--on-accent);box-shadow:0 2px 6px rgba(46,107,90,.3)}

.view-stack{position:relative;height:calc(100vh - var(--topbar-h) - env(safe-area-inset-top));height:calc(100dvh - var(--topbar-h) - env(safe-area-inset-top));overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg)}
#viewSched{transform:translateY(0)}
#viewCal{transform:translateY(-100%)}
.sw-hint{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(39,36,31,.86);
  color:#fff;font-size:12px;padding:6px 14px;border-radius:999px;z-index:8;
  opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;
}
.sw-hint.show{opacity:1}

/* ============ 课程表视图 ============ */
.sched-wrap{max-width:1060px;margin:0 auto;padding:2px 12px 20px}
.week-bar{
  display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:10px 12px;margin-bottom:12px;
}
.week-arrow{width:34px;height:34px;border-radius:10px;background:#F4F1E8;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent)}
.week-arrow:active{background:var(--accent-soft)}
.week-arrow svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.week-mid{flex:1;min-width:0}
.week-label{font-size:14px;font-weight:700;color:var(--accent)}
.week-label small{color:var(--muted);font-weight:400;font-size:12px;margin-left:4px}
.dots{display:flex;gap:4px;margin-top:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.dots::-webkit-scrollbar{display:none}
.dot{flex:none;width:13px;height:13px;border-radius:50%;border:2px solid var(--line);background:#fff;padding:0}
.dot.has{background:var(--accent-soft);border-color:var(--accent-soft)}
.dot.cur{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,107,90,.16)}
.dot.today{outline:2px dashed var(--faint);outline-offset:1px}
.today-btn{flex:none;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;color:var(--accent);background:#fff;font-weight:600}

.grid-wrap{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);overflow:visible;
}
table#timetable{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
table#timetable th,table#timetable td{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
table#timetable tr:last-child td{border-bottom:none}
thead th{
  position:sticky;top:0;z-index:3;background:#FAF8F3;font-weight:600;font-size:12px;
  color:var(--muted);padding:7px 2px;text-align:center;letter-spacing:.5px;
}
thead th .d{display:block;font-size:10px;color:var(--faint);font-weight:400;margin-top:1px}
thead th.today{background:var(--accent-soft);color:var(--accent)}
thead th.wk{color:var(--red)}
th.corner{position:sticky;left:0;top:0;z-index:4;background:#FAF8F3;min-width:52px}
td.period{
  position:sticky;left:0;z-index:2;background:#FAF8F3;text-align:center;padding:0 2px;
  min-width:52px;vertical-align:middle;
}
td.period b{display:block;font-size:13px;color:var(--ink);font-weight:600}
td.period span.t{display:block;font-size:9.5px;color:var(--faint);white-space:nowrap;margin-top:1px}
td.period.now{background:var(--accent-soft)}
td.period.now b,td.period.now span{color:var(--accent)}
tbody td{height:64px;vertical-align:top}
tbody td.empty{background:#FCFBF8}
tbody td.course{padding:3px 4px;background:var(--c);vertical-align:top;transition:filter .15s}
tbody td.course:active{filter:brightness(.95)}
.course-inner{display:block;width:100%;height:100%;text-align:left;padding:4px 5px;border-radius:8px}
.course-name{font-size:12px;font-weight:700;color:var(--ink);line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.course-meta{font-size:10.5px;color:#6A6458;margin-top:2px;line-height:1.3}
.course-meta .row{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-hint{color:var(--faint);font-size:11px;text-align:center;padding-top:22px;line-height:1.6}
.grid-foot{padding:9px 14px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}

.unsched{margin-top:12px;background:#FDFAF2;border:1px solid #EAD9B8;border-radius:var(--r-lg);box-shadow:var(--shadow);padding:12px 14px}
.unsched h3{font-size:13px;color:#8A6420;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.unsched h3 svg{width:15px;height:15px;stroke:#B98A2F;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.unsched .item{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--ink);align-items:center}
.unsched .item b{font-weight:600}
.unsched .item .tag{background:#FBF3E0;color:#8A6420;border-radius:6px;padding:2px 8px;font-size:11.5px}

.bottom-nav{
  position:sticky;bottom:0;z-index:10;display:flex;margin-top:14px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;color:var(--muted);font-size:11px;font-weight:600}
.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--accent)}

/* ============ 日历视图 ============ */
.cal-wrap{max-width:520px;margin:0 auto;padding:4px 14px 40px;display:flex;flex-direction:column;gap:16px}
.month-row{display:flex;align-items:center;gap:10px}
.nav-btn{width:38px;height:38px;border-radius:13px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.nav-btn:active{background:var(--accent-soft)}
.nav-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.month-title{flex:1;text-align:center;min-width:0}
.month-title h1{font-size:18px;font-weight:800;letter-spacing:.01em}
.month-title span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.pill-btn{
  flex:none;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);
  border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;color:var(--accent);
}
.pill-btn:active{background:var(--accent-soft)}
.stats-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.stats-row::-webkit-scrollbar{display:none}
.stat{flex:none;display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 11px;box-shadow:var(--shadow)}
.stat i{width:9px;height:9px;border-radius:3px;flex:none}
.stat b{font-size:12.5px;font-weight:700;line-height:1}
.stat span{font-size:11px;color:var(--muted)}
.calendar-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:14px 12px 16px;
}
.grid-head{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.grid-head span{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.grid-head span.wk{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day-cell{
  position:relative;min-height:52px;padding:6px 1px 4px;display:flex;flex-direction:column;
  align-items:center;gap:3px;border-top:1px solid var(--line);border-radius:10px;
}
.day-cell:not(:nth-child(7n+1)){border-left:1px solid var(--line)}
.day-cell:active{background:var(--accent-soft)}
.day-num{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.day-cell.weekend .day-num{color:var(--red)}
.day-cell.today .day-num{background:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:0 2px 6px rgba(46,107,90,.35)}
.day-cell.selected:not(.today) .day-num{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent);font-weight:700}
.day-cell.dim{opacity:.38}
.day-cell.dim .day-num{color:var(--ink)}
.day-marks{display:flex;gap:2px;align-items:center;min-height:14px}
.mk{font-style:normal;font-size:11px;line-height:1;font-weight:600}
.mk-done{color:var(--accent)}
.mk-imp{color:var(--amber)}
.mk-alert{color:var(--red)}
.mk-focus{color:var(--blue)}
.mk-memo{color:var(--purple)}
.mk-more{font-size:9px;color:var(--muted);font-weight:700}
.day-dot{position:absolute;right:7px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.day-note{position:absolute;right:7px;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.legend{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.lg-group{display:flex;align-items:center;gap:12px}
.lg{display:inline-flex;align-items:center;gap:5px}
.lg-dot{width:5px;height:5px;border-radius:50%;background:var(--muted)}
.lg-dot-red{background:var(--red)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);flex:none}
.seg-btn{padding:5px 10px;font-size:11.5px;font-weight:600;color:var(--muted)}
.seg-btn.active{background:var(--accent-soft);color:var(--accent)}
.hint{text-align:center;font-size:11px;color:var(--faint);margin-top:8px;opacity:0;transition:opacity .3s}
.hint.show{opacity:1}

/* ============ 日历详情（移动端底部抽屉 / 桌面右侧面板） ============ */
.detail-panel{
  background:var(--card);
}
.sheet-handle{display:none}
.detail-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.detail-week{font-size:12px;color:var(--muted);font-weight:500}
.detail-date{font-size:20px;font-weight:800;margin-top:2px}
.icon-btn{width:32px;height:32px;border-radius:50%;background:#F4F1E8;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
#detailBody{display:flex;flex-direction:column;gap:18px}
#detailBody[hidden]{display:none}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
.sec-title>span:first-child{font-size:13px;font-weight:700;letter-spacing:.02em}
.sec-tip{font-size:11px;color:var(--muted);font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);transition:all .15s;background:#FCFBF8}
.chip .sym{font-size:15px;line-height:1}
.chip.active{color:var(--chip-color);border-color:var(--chip-color);background:var(--chip-soft)}
textarea#notesInput{width:100%;border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;resize:vertical;min-height:96px;background:#FCFBF8;line-height:1.65;font-size:14px}
textarea#notesInput:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.todos{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.todo-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:#FCFBF8;transition:opacity .15s}
.todo-item.done{opacity:.72}
.todo-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;color:transparent;transition:all .15s}
.todo-item.done .todo-check{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.todo-text{flex:1;word-break:break-all;font-size:13.5px}
.todo-item.done .todo-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.todo-del{color:var(--muted);font-size:17px;padding:4px 6px;opacity:.75;flex:none;line-height:1}
.todo-empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 0;border:1px dashed var(--line);border-radius:var(--r-md)}
.todo-add{display:flex;gap:8px}
.todo-add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px;background:#FCFBF8;font-size:14px}
.todo-add input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.todo-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.todo-rm{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--accent);font-weight:600}
.todo-bell{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--faint);opacity:.8;transition:all .15s}
.todo-bell:hover{background:#F0EDE4;color:var(--muted)}
.todo-bell.has{color:var(--accent);opacity:1}
.todo-bell.has:hover{background:#E3EFEA}
.todo-rmhint{font-size:11.5px;color:var(--muted);margin-top:-4px;margin-bottom:10px;line-height:1.5}
.todo-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.todo-rm{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--accent);font-weight:600}
.todo-bell{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--faint);opacity:.8;transition:all .15s}
.todo-bell:hover{background:#F0EDE4;color:var(--muted)}
.todo-bell.has{color:var(--accent);opacity:1}
.todo-bell.has:hover{background:#E3EFEA}
.todo-rmhint{font-size:11.5px;color:var(--muted);margin-top:-4px;margin-bottom:10px;line-height:1.5}
.add-btn{width:42px;flex:none;border-radius:var(--r-md);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 2px 8px rgba(46,107,90,.3)}
.add-btn:active{filter:brightness(.94)}
.link-btn{font-size:12px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link-btn:active{color:var(--red)}
.empty-date{color:var(--muted);font-size:13px;text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:var(--r-md)}
.view.lock{overflow:hidden}

@media (max-width:999px){
  .detail-panel{
    position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
    border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(39,36,31,.14);
    padding:8px 20px calc(20px + env(safe-area-inset-bottom));max-height:84dvh;overflow-y:auto;
    transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.32,.72,.35,1),visibility .32s;
  }
  .detail-panel.open{transform:translateY(0);visibility:visible}
  .sheet-handle{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 12px}
  .backdrop{position:fixed;inset:0;background:rgba(39,36,31,.35);z-index:55;opacity:0;pointer-events:none;transition:opacity .3s}
  .backdrop.show{opacity:1;pointer-events:auto}
}
@media (min-width:1000px){
  .detail-panel{
    position:fixed;top:calc(var(--topbar-h) + 22px);right:26px;width:356px;
    max-height:calc(100dvh - var(--topbar-h) - 48px);overflow-y:auto;
    border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px 20px 24px;z-index:40;
    visibility:hidden;opacity:0;transform:translateY(8px);
    transition:opacity .25s,transform .25s,visibility .25s;
  }
  .detail-panel.cal-active{visibility:visible;opacity:1;transform:none}
  .backdrop{display:none}
}

/* ============ 弹窗（课程管理 / 导入 / 设置） ============ */

  var out = {};
  String(expr||"").split(/[,，、\s]+/).forEach(function(seg){

}

  for(var i=0;i<PERIODS.length;i++){
    var a = +PERIODS[i].s.slice(0,2)*60 + +PERIODS[i].s.slice(3);
    var b = +PERIODS[i].e.slice(0,2)*60 + +PERIODS[i].e.slice(3);
    if(hm >= a && hm <= b) return i+1;
  }
  return 0;
}

/* ===== 渲染：课程表 ===== */
function coursesInWeek(w){
  return state.courses.filter(function(c){ return inWeek(c.weeks, w); });
}
function findCourseAt(week, day, period){
  for(var i=0;i<state.courses.length;i++){
    var c = state.courses[i];
    if(c.day === day && c.start <= period && period <= c.end && inWeek(c.weeks, week)) return c;
  }
  return null;
}
function weekDates(week){
  var start = new Date(state.termStart + "T00:00:00");
  var base = start.getTime() + (week - 1) * 7 * 86400000;
  var arr = [];
  for(var i=0;i<7;i++){
    var d = new Date(base + i * 86400000);
    arr.push((d.getMonth() + 1) + "/" + d.getDate());
  }
  return arr;
}
function renderTable(){
  var table = document.getElementById("timetable");
  var week = state.week;
  var today = todayDay();
  var nowP = currentPeriod();
  var dates = weekDates(week);
  var html = "<colgroup><col style='width:52px'><col><col><col><col><col><col><col></colgroup><thead><tr><th class='corner'>节次</th>";
  for(var d=1;d<=7;d++){
    html += "<th class='" + (d===today ? "today" : "") + (d>=6 ? " wk" : "") + "'>周" + "一二三四五六日".charAt(d-1) + "<span class='d'>" + dates[d-1] + "</span></th>";
  }
  html += "</tr></thead><tbody>";
  var used = {};
  var emptyCount = 0;
  for(var p=1;p<=13;p++){
    html += "<tr>";
    var isNow = (nowP === p);
    html += "<td class='period" + (isNow ? " now" : "") + "'><b>" + p + "</b><span class='t'>" + PERIODS[p-1].s + "</span><span class='t'>" + PERIODS[p-1].e + "</span></td>";
    for(var d2=1;d2<=7;d2++){
      var key = p*100 + d2;
      if(used[key]) continue;
      var c = findCourseAt(week, d2, p);
      if(c){
        var span = c.end - p + 1;
        for(var q=p;q<=c.end;q++){ used[q*100+d2] = c.id; }
        var color = colorOf(c.name);
        html += "<td rowspan='" + span + "' class='course' style='--c:" + color + "' onclick='showDetail(" + c.id + ")'>";
        html += "<div class='course-inner'><div class='course-name'>" + esc(c.name) + "</div>";
        html += "<div class='course-meta'><span class='row'>@" + esc(c.room) + "</span></div></div></td>";
      } else {
        emptyCount++;
        html += "<td class='empty'></td>";
      }
    }
    html += "</tr>";
  }
  html += "</tbody>";
  table.innerHTML = html;
  var foot = document.querySelector(".grid-foot");
  if(!foot){
    foot = document.createElement("div");
    foot.className = "grid-foot";
    table.parentNode.appendChild(foot);
  }
  var weekCourses = coursesInWeek(week);
  var allCount = state.courses.length;
  foot.innerHTML = "<span>本周 " + weekCourses.length + " 门课 / 共 " + allCount + " 条安排</span><span>点击课程查看详情</span>";
}

function detectSep(line){
  var c = line.indexOf(",") >= 0 ? 1 : 0, t = line.indexOf("\t") >= 0 ? 1 : 0;
  return (c && t) ? (line.indexOf("\t") < line.indexOf(",") ? "\t" : ",") : (t ? "\t" : ",");
}
function parseCSVLine(line, sep){
  var out = [], cur = "", inQ = false;
  for(var i=0;i<line.length;i++){
    var ch = line[i];
    if(inQ){
      if(ch === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else { inQ = false; } }
      else cur += ch;
    } else if(ch === '"'){ inQ = true; }
    else if(ch === sep){ out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}
function normalizeName(n){ return String(n||"").replace(/^\uFEFF/,"").trim(); }
function headerIndexes(fields){
  var map = {};
  var aliases = {
    name:["课程名称","课程名","名称","name","course","课程"],
    day:["星期","星期几","周几","day","weekday"],
    start:["开始节次","起始节次","第几节","开始","start","startperiod"],
    end:["结束节次","终止节次","结束","end","endperiod"],
    weeks:["周次","上课周次","周","weeks","week"],
    room:["教室","地点","room","location"],
    teacher:["教师","老师","任课教师","teacher"],
    cls:["班级","班级名称","class"]
  };
  fields.forEach(function(f, i){
    var key = normalizeName(f);
    for(var k in aliases){
      if(map[k] === undefined){
        for(var j=0;j<aliases[k].length;j++){
          if(key === aliases[k][j] || key.indexOf(aliases[k][j]) >= 0){ map[k] = i; break; }
        }
      }
    }
  });
  return map;
}
function parseImportedText(text){
  var lines = String(text).split(/\r\n|\r|\n/);
  var rows = [];
  for(var i=0;i<lines.length;i++){ if(normalizeName(lines[i])) rows.push(lines[i]); }
  if(!rows.length) return [];
  var sep = detectSep(rows[0]);
  var first = parseCSVLine(rows[0], sep).map(normalizeName);
  var isHeader = first.some(function(f){ return /课程|星期|周次|节次|教师|教室|班级|name|day|week/i.test(f); });
  var idx = isHeader ? headerIndexes(first) : null;
  var startLine = isHeader ? 1 : 0;
  var out = [];
  for(var r=startLine;r<rows.length;r++){
    var f = parseCSVLine(rows[r], sep).map(normalizeName);
    var rec = idx
      ? { name:f[idx.name], day:f[idx.day], start:f[idx.start], end:f[idx.end], weeks:f[idx.weeks], room:f[idx.room], teacher:f[idx.teacher], cls:f[idx.cls] }
      : { name:f[0], day:f[1], start:f[2], end:f[3], weeks:f[4], room:f[5], teacher:f[6], cls:f[7] };
    if(!rec.name) continue;
    var day = +rec.day, start = +rec.start, end = +rec.end;
    if(!day || day < 1 || day > 7) day = 1;
    if(!start || start < 1 || start > 13) start = 1;
    if(!end || end < 1 || end > 13) end = start;
    if(end < start) end = start;
    rec.day = day; rec.start = start; rec.end = end;
    if(!parseWeeks(rec.weeks).length) rec.weeks = "1-" + state.maxWeek;
    rec.id = nextId();
    out.push(rec);
  }
  return out;
}
function importFromText(mode){
  var txt = document.getElementById("importText").value;
  if(!normalizeName(txt)){ toast("请先粘贴课程数据"); return; }
  var recs = parseImportedText(txt);
  if(!recs.length){ toast("没有解析到有效课程，请检查格式"); return; }
  applyImported(recs, mode);
}
function importFromFile(mode){
  var input = document.getElementById("fileInput");
  var file = input.files && input.files[0];
  if(!file){ toast("请先选择文件"); return; }
  var reader = new FileReader();
  reader.onload = function(){
    var txt = String(reader.result || "");
    var recs = [];
    if(/\.json$/i.test(file.name)){
      try{
        var arr = JSON.parse(txt);
        if(!Array.isArray(arr)) throw new Error("not array");
        recs = arr.map(function(o){
          return { id:nextId(), name:o.name||"", day:+o.day||1, start:+o.start||1, end:+o.end||(+o.start||1), weeks:o.weeks||("1-"+state.maxWeek), room:o.room||"", teacher:o.teacher||"", cls:o.cls||"" };
        }).filter(function(o){ return o.name; });
      }catch(e){ toast("JSON 解析失败"); return; }
    } else {
      recs = parseImportedText(txt);
    }
    if(!recs.length){ toast("没有解析到有效课程"); return; }
    applyImported(recs, mode);
  };
  reader.readAsText(file, "utf-8");
}
function applyImported(recs, mode){
  if(mode === "replace"){
    state.courses = recs;
    toast("已导入 " + recs.length + " 条安排（替换原数据）");
  } else {
    state.courses = state.courses.concat(recs);
    toast("已追加 " + recs.length + " 条安排");
  }
  saveState();
  renderAll();
  openManage();
}

function downloadFile(name, content, mime){
  var blob = new Blob(["\uFEFF" + content], {type: mime || "text/plain;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 600);
}
function toCSV(){
  var head = "课程名称,星期,开始节次,结束节次,周次,教室,教师,班级";
  var rows = state.courses.map(function(c){
    return [c.name, c.day, c.start, c.end, c.weeks, c.room||"", c.teacher||"", c.cls||""]
      .map(function(v){ v = String(v); return (v.indexOf(",") >= 0 || v.indexOf('"') >= 0) ? '"' + v.replace(/"/g,'""') + '"' : v; })
      .join(",");
  });
  return head + "\n" + rows.join("\n");
}
function exportCSV(){
  if(!state.courses.length){ toast("暂无数据可导出"); return; }
  downloadFile("研究生课程表.csv", toCSV(), "text/csv;charset=utf-8");
  toast("已导出 CSV");
}
function exportJSON(){
  if(!state.courses.length){ toast("暂无数据可导出"); return; }
  downloadFile("研究生课程表.json", JSON.stringify(state.courses, null, 2), "application/json;charset=utf-8");
  toast("已导出 JSON");

function bindEvents(){

function handleDroppedFile(files){
  if(!files || !files.length) return;
  var file = files[0];
  if(!/\.(csv|json|txt)$/i.test(file.name) && !/csv|json|text/.test(file.type)){ toast("请选择 CSV / JSON / TXT 文件"); return; }
  var reader = new FileReader();
  reader.onload = function(){
    var txt = String(reader.result || "");
    var recs = /\.json$/i.test(file.name)
      ? (function(){ try{ var arr = JSON.parse(txt); if(!Array.isArray(arr)) throw 0; return arr.map(function(o){ return {id:nextId(), name:o.name||"", day:+o.day||1, start:+o.start||1, end:+o.end||(+o.start||1), weeks:o.weeks||("1-"+state.maxWeek), room:o.room||"", teacher:o.teacher||"", cls:o.cls||""}; }).filter(function(o){ return o.name; }); }catch(e){ toast("JSON 解析失败"); return null; } })()
      : parseImportedText(txt);
    if(recs === null) return;
    if(!recs.length){ toast("没有解析到有效课程"); return; }
    applyImported(recs, "replace");
  };
  reader.readAsText(file, "utf-8");
}

(function(){

var remindPickTarget=null;

try{if(typeof TimestampTrigger!=='undefined'&&('showTrigger' in (typeof Notification!=='undefined'?Notification.prototype:{}))){new TimestampTrigger(Date.now()+60000);SUPPORT_TRIGGER=true;}}catch(e){SUPPORT_TRIGGER=false;}

var data={marks:{},notes:{},todos:{}};

(function(){var q=location.search.match(/[?&]d=(\d{4}-\d{2}-\d{2})/);if(q){var _d=parseISO(q[1]);view=new Date(_d.getFullYear(),_d.getMonth(),1);sel=q[1];}})();

function fmtISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ===== 数据持久化 ===== */
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var d=JSON.parse(raw);
      data.marks=d.marks||{};
      /* 旧版 √ 完成标记迁移为 ▲ */
      for(var k in data.marks){
        var arr=data.marks[k];
        if(Array.isArray(arr)&&arr.indexOf('√')>=0){
          data.marks[k]=arr.map(function(s){return s==='√'?'▲':s;});
        }
      }
      data.notes=d.notes||{}; data.todos=d.todos||{};
      if(d.ws===0||d.ws===1)ws=d.ws;
    }
  }catch(e){}
  hintShown=!!localStorage.getItem(KEY+'.hint');
}

    var mk=data.marks[iso]||[];
    if(mk.indexOf('▲')>=0)doneDays++;
    var ts=data.todos[iso]||[];
    for(var j=0;j<ts.length;j++){if(!ts[j].done)openTodos++;}
  }

/* ===== 周表头与网格 ===== */
function renderHead(){

function renderGrid(){
  var y=view.getFullYear(),m=view.getMonth();
  var first=new Date(y,m,1);
  var offset=(first.getDay()-ws+7)%7;
  var dim=new Date(y,m+1,0).getDate();
  var total=Math.ceil((offset+dim)/7)*7;
  var today=fmtISO(new Date());
  var html='';
  for(var i=0;i<total;i++){
    var d=new Date(y,m,i-offset+1);
    var iso=fmtISO(d);
    var inM=d.getMonth()===m;
    var mk=data.marks[iso]||[];
    var todos=data.todos[iso]||[];
    var open=false;for(var k=0;k<todos.length;k++){if(!todos[k].done){open=true;break;}}
    var cls=['day-cell'];
    if(!inM)cls.push('dim');
    if(d.getDay()===0||d.getDay()===6)cls.push('weekend');
    if(iso===today)cls.push('today');
    if(iso===sel)cls.push('selected');
    var marksHtml='';
    if(mk.length){
      var show='';
      for(var q=0;q<Math.min(2,mk.length);q++){
        var mdef=null;
        for(var r=0;r<MARKS.length;r++){if(MARKS[r].sym===mk[q]){mdef=MARKS[r];break;}}
        if(mdef)show+='<i class="mk '+mdef.cls+'">'+mdef.sym+'</i>';
      }
      if(mk.length>2)show+='<i class="mk mk-more">+'+(mk.length-2)+'</i>';
      marksHtml='<span class="day-marks">'+show+'</span>';
    }
    var dot=open?'<span class="day-dot"></span>':'';
    var noteDot=(data.notes[iso]||'').trim()?'<span class="day-note"></span>':'';
    var wd=W[d.getDay()];

    html+='<button class="'+cls.join(' ')+'" data-date="'+iso+'" aria-label="'+label+'">'+dot+noteDot+'<span class="day-num">'+d.getDate()+'</span>'+marksHtml+'</button>';
  }

}

var curView='sched';
function setView(v){

  var toCal=(v==='cal');
  if(!toCal&&window.__closeCalDetail){window.__closeCalDetail();}
  s.style.transition='none';c.style.transition='none';

  else{c.style.transform='translateY(0)';s.style.transform='translateY(100%)';}

  else{c.style.transform='translateY(-100%)';s.style.transform='translateY(0)';}
  curView=v;

function syncSeg(v){

  var segs=document.querySelectorAll('#viewSeg button');
  for(var i=0;i<segs.length;i++){
    var on=segs[i].getAttribute('data-view')===v;

function hideSwHint(){

function attachSwipe(el){
  var startY=null,pending=false;
  el.addEventListener('touchstart',function(e){startY=e.touches[0].clientY;pending=false;},{passive:true});
  el.addEventListener('touchmove',function(e){
    if(startY===null)return;
    var panel=$('detailPanel');
    if(panel&&panel.classList.contains('open')){startY=null;pending=false;return;}
    var dy=e.touches[0].clientY-startY;
    var atTop=el.scrollTop<=1,atBot=el.scrollTop+el.clientHeight>=el.scrollHeight-1;
    var can=(dy>0&&atTop)||(dy<0&&atBot);
    if(can&&Math.abs(dy)>10){
      pending=true;
      if(e.cancelable)e.preventDefault();
    }else if(Math.abs(dy)>10&&!can){
      pending=false;
    }
  },{passive:false});
  el.addEventListener('touchend',function(e){
    if(!pending||startY===null)return;
    var dy=e.changedTouches[0].clientY-startY;
    startY=null;pending=false;
    if(Math.abs(dy)>56){setView(curView==='sched'?'cal':'sched');}
  },{passive:true});
  el.addEventListener('touchcancel',function(){startY=null;pending=false;});
}
/* 顶栏切换 */
$('viewSeg').addEventListener('click',function(e){
  var b=e.target.closest('button');
  if(!b)return;
  setView(b.getAttribute('data-view'));
});
attachSwipe($('viewSched'));
attachSwipe($('viewCal'));
syncSeg('sched');

/* ===== PWA：http/https 下动态注入 manifest + SW 注册（file:// 下避免 CORS 报错） ===== */
if(location.protocol==='http:'||location.protocol==='https:'){
  var mlink=document.createElement('link');
  mlink.rel='manifest';mlink.href='./manifest.json';
  document.head.appendChild(mlink);
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(function(){});
}

/* ===== 待办提醒：通知调度 ===== */
function swReminders(){try{return JSON.parse(localStorage.getItem(KEY+'.sw')||'[]');}catch(e){return [];}}
function isSWReminded(tag){return swReminders().indexOf(tag)>=0;}
function markSWReminded(tag){var a=swReminders();if(a.indexOf(tag)<0){a.push(tag);try{localStorage.setItem(KEY+'.sw',JSON.stringify(a));}catch(e){}}}
function remindedSet(){try{return JSON.parse(localStorage.getItem(remindedKey)||'{}');}catch(e){return {};}}
function isReminded(iso,id){return !!remindedSet()[iso+'|'+id];}
function markReminded(iso,id){var s=remindedSet();s[iso+'|'+id]=1;try{localStorage.setItem(remindedKey,JSON.stringify(s));}catch(e){}}
function clearSWNotify(tag){
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.getRegistration().then(function(r){
    if(r)r.getNotifications({tag:tag}).then(function(ns){ns.forEach(function(n){n.close();});});
  }).catch(function(){});
}
function ensureNotifyPerm(cb){
  if(!('Notification' in window)){toast('当前浏览器不支持通知提醒');return;}
  if(location.protocol==='file:'){toast('本地文件模式不支持系统通知，请打开在线链接使用');return;}
  if(Notification.permission==='granted'){cb&&cb();return;}
  if(Notification.permission==='denied'){toast('通知权限被拒绝，请在浏览器地址栏左侧的权限设置中开启');return;}
  try{Notification.requestPermission().then(function(p){
    if(p==='granted'){cb&&cb();}else{toast('未授权通知，无法提醒');}
  });}catch(e){}
}
function scheduleRemind(iso,t){
  if(!t.rm)return 'none';
  var pick=new Date(parseISO(iso).getTime());
  var hm=t.rm.split(':');
  pick.setHours(+hm[0],+hm[1],0,0);
  var diff=pick.getTime()-Date.now();
  if(diff<=0)return 'none';
  if(SUPPORT_TRIGGER&&('serviceWorker' in navigator)){
    var tag='rm-'+iso+'-'+t.id;
    try{
      navigator.serviceWorker.ready.then(function(reg){
        return reg.showNotification('课程日历 · 待办提醒',{
          body:'今天 '+t.rm+'：'+t.text,
          tag:tag,icon:'./icons/icon-192.png',badge:'./icons/icon-192.png',
          data:{iso:iso,url:'./index.html?d='+iso},
          showTrigger:new TimestampTrigger(pick.getTime())
        });
      }).then(function(){markSWReminded(tag);}).catch(function(){});
      return 'sw';
    }catch(e){return 'page';}
  }
  return 'page';
}
function checkReminders(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  var now=new Date();
  var iso=fmtISO(now);
  var hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  var list=data.todos[iso]||[];
  for(var i=0;i<list.length;i++){
    var t=list[i];
    if(!t.rm||t.done||t.rm>hm||isReminded(iso,t.id))continue;
    var tag='rm-'+iso+'-'+t.id;
    if(SUPPORT_TRIGGER&&isSWReminded(tag))continue;
    markReminded(iso,t.id);
    try{new Notification('课程日历 · 待办提醒',{body:'今天 '+t.rm+'：'+t.text,icon:'./icons/icon-192.png',tag:tag,data:{iso:iso}});}catch(e){}
  }
}
$('remindPick').addEventListener('change',function(){
  var id=remindPickTarget;remindPickTarget=null;
  if(!id)return;
  var list=data.todos[sel]||[],t=null;
  for(var i=0;i<list.length;i++){if(list[i].id===id){t=list[i];break;}}
  if(!t)return;
  var v=this.value;this.value='';
  if(!v)return;
  var base=new Date();base.setHours(0,0,0,0);
  var diff=Math.round((parseISO(sel).getTime()-base.getTime())/86400000);
  if(diff<0||diff>7){toast('提醒只能设在今天起 7 天内');return;}
  t.rm=v;
  persist();renderTodos();renderGrid();renderTop();
  ensureNotifyPerm(function(){
    var mode=scheduleRemind(sel,t);
    if(mode==='sw')toast('已设置提醒 '+sel+' '+v+'，到点将后台通知');
    else if(mode==='page')toast('已设置提醒 '+sel+' '+v+'（页面打开时到点通知）');
    else toast('已设置提醒 '+sel+' '+v);
  });
});
if('Notification' in window){
  window.addEventListener('notificationclick',function(e){
    var n=e.notification;
    if(n&&n.data&&n.data.iso){
      var d=parseISO(n.data.iso);
      view=new Date(d.getFullYear(),d.getMonth(),1);
      sel=n.data.iso;
      hideHint();flushNotes();renderCalAll();openDetail();
    }
  });
}
setInterval(checkReminders,15000);
checkReminders();

/* 首次进入：触摸设备显示滑动切换提示 */
if(!localStorage.getItem('mergedView.hint')&&('ontouchstart' in window)){
  setTimeout(function(){var h=$('swHint');if(h)h.classList.add('show');},600);
}
</script>
